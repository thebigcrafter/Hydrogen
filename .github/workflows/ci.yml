name: Run static analysis and code style checks

on:
  push:
  pull_request:
  
jobs:
  phpstan:
    name: Analyze PHP code with PHPStan
    runs-on: ${{ matrix.image }}
    
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04]
        php: ["8.2"]
    
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      
      - name: Set up PHP environment
        uses: pmmp/setup-php-action@e031917a35223b96cba12fe19ace0765c91f6bfb
        with:
          php-version: ${{ matrix.php }}
          install-path: "./bin"
          pm-version-major: "5"
          
      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
            
      - name: Install Composer dependencies
        run: composer install --prefer-dist
        
      - name: Run PHPStan analysis
        run: composer run-script analyse

      - name: Run Hydrogen runtime tests
        run: composer run-script test
        
  codestyle:
    name: Check PHP code style
    runs-on: ubuntu-24.04
    
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP environment
        uses: shivammathur/setup-php@73aede52cb368fb5bfc2956c593eb40704b51cca
        with:
          php-version: 8.2
          tools: php-cs-fixer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PHP code style
        run: php-cs-fixer fix --dry-run --ansi --diff
