name: Run static analysis and code style checks

on:
  push:
  pull_request:
  
jobs:
  phpstan:
    name: Analyze PHP code with PHPStan
    runs-on: ${{ matrix.image }}
    
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-latest]
        php: ["8.2"]
    
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      
      - name: Set up PHP environment
        uses: pmmp/setup-php-action@589cc43fddede20c8b0469828431d747fb1a1145
        with:
          php-version: ${{ matrix.php }}
          install-path: "./bin"
          pm-version-major: "5"
          
      - name: Get Composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
            
      - name: Install Composer dependencies
        run: composer install --prefer-dist
        
      - name: Run PHPStan analysis
        run: composer run-script analyse
        
  codestyle:
    name: Check PHP code style
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Set up PHP environment
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: 8.2
          tools: php-cs-fixer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PHP code style
        run: php-cs-fixer fix --dry-run --ansi --diff
